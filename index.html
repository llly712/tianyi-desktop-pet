<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>洛天依</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #input-area, #bubble, #send-btn, #chat-input, button { -webkit-app-region: no-drag; }

  #canvas-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
  }
  canvas { display: block; }

  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding-bottom: 8px;
    z-index: 10;
  }
  #ui-layer > * { pointer-events: auto; }

  #bubble {
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    max-width: 300px; min-width: 80px;
    background: rgba(255,255,255,0.92); border-radius: 16px;
    padding: 10px 16px;
    font-size: 14px; line-height: 1.5;
    color: #333; box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity 0.25s;
    text-align: center; font-family: 'Microsoft YaHei', sans-serif;
    word-break: break-word;
  }
  #bubble::after {
    content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 8px solid rgba(255,255,255,0.92);
  }
  #bubble.visible { opacity: 1; }

  #input-area {
    display: none; gap: 6px; padding: 8px 12px;
    align-items: center;
    background: rgba(0,0,0,0.3);
    border-radius: 24px;
    margin: 0 8px 8px 8px;
  }
  #input-area.visible { display: flex; }
  #chat-input {
    flex: 1; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px; padding: 8px 14px; font-size: 14px; outline: none;
    color: #333; font-family: 'Microsoft YaHei', sans-serif;
    height: 36px;
  }
  #send-btn, #mic-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #send-btn { background: rgba(102,187,255,0.9); color: #fff; }
  #mic-btn { background: rgba(255,140,140,0.85); color: #fff; }
  #mic-btn.listening { background: rgba(255,60,60,0.95); animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,60,60,0.6); } 50% { box-shadow: 0 0 0 6px rgba(255,60,60,0); } }

  #drag-handle {
    position: absolute; top: 0; left: 0; width: 100%; height: 24px;
    -webkit-app-region: drag;
    z-index: 20;
    pointer-events: auto;
  }
    width: 8px; height: 8px; border-radius: 50%;
    background: #999; transition: background 0.3s;
  }
  #status-dot.connected { background: #4f4; }
  #status-dot.disconnected { background: #f44; }

  .debug {
    position: absolute; bottom: 2px; left: 4px;
    font-size: 10px; color: rgba(0,0,0,0.3); font-family: monospace;
    display: none;
  }
</style>
</head>
<body>

<div id="drag-handle"></div>
<div id="canvas-container"></div>
<div id="drag-handle"></div>
<div id="bubble"></div>
<div id="status-dot"></div>
<div class="debug" id="debug"></div>

<div id="ui-layer">
  <div id="input-area">
    <input id="chat-input" type="text" placeholder="聊天 / agent:任务 本地执行" maxlength="500">
    <button id="mic-btn" title="语音输入">🎙</button>
    <button id="send-btn">↑</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "http://127.0.0.1:59876/three.module.js",
    "three/addons/": "http://127.0.0.1:59876/jsm/"
  }
}
</script>

<script src="agent_handler.js"></script>
<script type="module" src="renderer.js"></script>
</body>
</html>
